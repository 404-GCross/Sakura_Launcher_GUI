name: build

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: "Create new release"
        required: true
        type: boolean
  push:
    branches:
      - main
    paths: [".github/workflows/build.yml", "main.spec", "main_debug.spec", "requirements.txt", "packaging/linux/**", "**/*.py"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/build.yml", "main.spec", "main_debug.spec", "requirements.txt", "packaging/linux/**", "**/*.py"]

jobs:
  windows-latest:
    runs-on: windows-latest

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Environment
        id: pyenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        id: pyinstaller_build
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm main.spec
          Rename-Item -Path "dist\main.exe" -NewName "Sakura_Launcher_GUI_$('${{ github.sha }}'.Substring(0,7)).exe"

      - name: Upload artifacts
        if: ${{ ( github.event_name == 'push' && github.ref == 'refs/heads/main' ) || github.event.inputs.create_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows_dist
          path: dist

  macos-latest:
    runs-on: macos-latest

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Environment
        id: pyenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pillow  # 安装 pillow 以保证图标正常转换

      - name: Build
        id: pyinstaller_build
        run: |
          pyinstaller --clean --noconfirm main.spec
          mv dist/SakuraLauncher.app dist/Sakura_Launcher_GUI_macOS_$(echo $GITHUB_SHA | cut -c1-7).app  # 修改重命名逻辑

      - name: Upload artifacts
        if: ${{ ( github.event_name == 'push' && github.ref == 'refs/heads/main' ) || github.event.inputs.create_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos_dist
          path: dist

  linux-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            curl \
            fakeroot \
            file \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            rpm

      - name: Install Python Environment
        id: pyenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pillow

      - name: Build Linux packages
        id: linux_package_build
        run: |
          packaging/linux/build_packages.sh

      - name: Upload artifacts
        if: ${{ ( github.event_name == 'push' && github.ref == 'refs/heads/main' ) || github.event.inputs.create_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux_dist
          path: dist/linux
